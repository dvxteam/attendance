<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>เช็คชื่อเข้าเรียน</title>
<style>
  :root { --green:#06c755; --red:#e5484d; --amber:#f5a524; --ink:#1f2328; --muted:#6b7280; --bg:#f4f6f8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Sarabun","Noto Sans Thai",-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:460px; margin:0 auto; padding:20px 16px 40px; min-height:100vh; display:flex; flex-direction:column; }
  header { font-weight:700; font-size:18px; padding:4px 0 16px; display:flex; align-items:center; gap:8px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--green); }
  .card { background:#fff; border-radius:16px; padding:22px 20px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  h2 { margin:0 0 6px; font-size:22px; }
  p { margin:6px 0; line-height:1.55; }
  .muted { color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid #d6dae0; border-radius:10px; outline:none; }
  input:focus { border-color:var(--green); }
  button { width:100%; font:inherit; font-size:17px; font-weight:700; padding:14px; border:0; border-radius:12px; margin-top:18px; cursor:pointer; background:var(--green); color:#fff; }
  button.ghost { background:#eef1f4; color:var(--ink); font-weight:600; }
  button:disabled { opacity:.55; }
  .big { font-size:64px; line-height:1; margin:6px 0 12px; }
  .center { text-align:center; }
  .ok h2 { color:var(--green); } .late h2 { color:var(--amber); } .err h2 { color:var(--red); }
  .row { display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid #eef0f2; font-size:15px; }
  .row:first-of-type { border-top:0; }
  .spinner { width:42px; height:42px; border:4px solid #dfe3e8; border-top-color:var(--green); border-radius:50%; animation:spin 1s linear infinite; margin:10px auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="dot"></span>เช็คชื่อเข้าเรียน</header>
  <div id="app" class="card center"><div class="spinner"></div><p class="muted">กำลังเปิด...</p></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script>
const C = window.APP_CONFIG;
const app = document.getElementById('app');
const state = { idToken: null, status: null };

const ERR = {
  invalid_token: 'ยืนยันตัวตน LINE ไม่ผ่าน กรุณาปิดหน้านี้แล้วสแกนใหม่',
  not_registered: 'ยังไม่ได้ลงทะเบียน',
  session_not_found: 'ไม่พบคาบเรียนนี้',
  session_closed: 'คาบเรียนนี้ปิดการเช็คชื่อแล้ว',
  wrong_class: 'คุณไม่ได้อยู่ในรายชื่อห้องของคาบนี้',
  qr_expired: 'QR หมดอายุแล้ว กรุณาสแกน QR บนจออีกครั้ง',
  qr_invalid: 'QR ไม่ถูกต้อง',
  location_required: 'ต้องเปิดตำแหน่ง (GPS) จึงจะเช็คชื่อได้',
  location_denied: 'LINE ยังไม่ได้รับอนุญาตให้ใช้ตำแหน่ง',
  location_timeout: 'หาตำแหน่งไม่ทัน ลองขยับไปใกล้หน้าต่างแล้วสแกนใหม่',
  geofence_not_set: 'ครูยังไม่ได้ตั้งตำแหน่งห้องเรียน แจ้งครู',
  too_far: 'ตำแหน่งของคุณอยู่นอกพื้นที่ห้องเรียน',
  already_registered: 'บัญชี LINE นี้ลงทะเบียนไว้แล้ว',
  student_taken: 'รหัสนักเรียนนี้ผูกกับบัญชี LINE อื่นไปแล้ว ถ้าไม่ใช่คุณ ให้แจ้งครู',
  not_in_roster: 'ไม่พบรหัสนี้ในรายชื่อห้อง ตรวจรหัสอีกครั้งหรือแจ้งครู',
  bad_student_id: 'รูปแบบรหัสนักเรียนไม่ถูกต้อง',
  name_required: 'กรุณากรอกชื่อ-นามสกุล',
  not_setup: 'ระบบยังตั้งค่าไม่เสร็จ แจ้งครู',
  network: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง',
};
const msg = r => (ERR[r.error] || ('เกิดข้อผิดพลาด: ' + r.error)) +
  (r.error === 'too_far' && r.distanceM ? ` (ห่าง ${r.distanceM} ม.)` : '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, data) {
  try {
    // ส่งเป็น text/plain เพื่อไม่ให้เกิด CORS preflight กับ Apps Script
    const r = await fetch(C.API_URL, { method: 'POST', body: JSON.stringify({ action, ...data }) });
    return await r.json();
  } catch (e) {
    return { ok: false, error: 'network' };
  }
}

function readParams(search) {
  const q = new URLSearchParams(search);
  const s = q.get('s'), w = q.get('w'), h = q.get('h');
  return (s && w && h) ? { s, w, h } : null;
}

function loading(text) {
  app.className = 'card center';
  app.innerHTML = `<div class="spinner"></div><p class="muted">${esc(text)}</p>`;
}

function showError(text, withScan) {
  app.className = 'card center err';
  app.innerHTML = `<div class="big">⚠️</div><h2>เช็คชื่อไม่สำเร็จ</h2><p>${esc(text)}</p>
    ${withScan ? '<button id="scan">สแกน QR อีกครั้ง</button>' : ''}
    <button class="ghost" id="close">ปิด</button>`;
  bind();
}

function showHome() {
  const s = state.status.student;
  app.className = 'card';
  app.innerHTML = `<h2>สวัสดี ${esc(s.name)}</h2>
    <p class="muted">รหัส ${esc(s.studentId)}${s.classroom ? ' · ห้อง ' + esc(s.classroom) : ''}</p>
    <p style="margin-top:16px">สแกน QR บนจอหน้าห้องเพื่อเช็คชื่อ</p>
    <button id="scan">📷 สแกน QR</button>
    <button class="ghost" id="close">ปิด</button>`;
  bind();
}

function showRegister() {
  const roster = state.status.requireRoster;
  app.className = 'card';
  app.innerHTML = `<h2>ลงทะเบียนครั้งแรก</h2>
    <p class="muted">ผูกบัญชี LINE นี้กับรหัสนักเรียน (ทำครั้งเดียว และเปลี่ยนเองไม่ได้)</p>
    <label>รหัสนักเรียน</label>
    <input id="sid" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="69xxxxxxxxxxx">
    ${roster ? '' : `<label>ชื่อ-นามสกุล</label><input id="name" placeholder="ด.ช. ตัวอย่าง ใจดี">
    <label>ห้อง</label><input id="room" placeholder="เช่น ม.2/1">`}
    <div id="match" style="display:none;margin:10px 0;padding:12px;border-radius:10px;background:#eef7ee;font-size:15px"></div>
    <p id="regErr" style="color:var(--red);font-size:14px"></p>
    <button id="reg"${roster ? ' disabled' : ''}>${roster ? 'กรอกรหัสนักศึกษาให้ครบ' : 'ลงทะเบียน'}</button>`;
  const sidEl = document.getElementById('sid'), matchEl = document.getElementById('match');
  const errEl = document.getElementById('regErr'), regBtn = document.getElementById('reg');
  let lookupSeq = 0;
  if (roster) sidEl.addEventListener('input', async () => {
    const v = sidEl.value.trim(), seq = ++lookupSeq;
    matchEl.style.display = 'none'; errEl.textContent = '';
    regBtn.disabled = true; regBtn.textContent = 'กรอกรหัสนักศึกษาให้ครบ';
    if (v.length < 13) return;
    regBtn.textContent = 'กำลังค้นหาชื่อ...';
    const r = await api('lookup', { idToken: state.idToken, studentId: v });
    if (seq !== lookupSeq) return;
    if (!r.ok) { regBtn.textContent = 'กรอกรหัสนักศึกษาให้ครบ'; return errEl.textContent = msg(r); }
    matchEl.innerHTML = `ชื่อตามรายชื่อ:<br><b style="font-size:17px">${esc(r.student.name)}</b>` +
      (r.student.classroom ? `<br><span class="muted">รายวิชา ${esc(r.student.classroom)}</span>` : '') +
      `<br><span class="muted">ถ้าไม่ใช่ชื่อคุณ อย่ากดยืนยัน</span>`;
    matchEl.style.display = 'block';
    regBtn.disabled = false; regBtn.textContent = 'ใช่ ยืนยันว่าเป็นฉัน';
  });
  document.getElementById('reg').onclick = async () => {
    const btn = document.getElementById('reg');
    const studentId = document.getElementById('sid').value.trim();
    if (!studentId) return document.getElementById('regErr').textContent = 'กรุณากรอกรหัสนักเรียน';
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    const r = await api('register', {
      idToken: state.idToken, studentId,
      name: roster ? '' : document.getElementById('name').value.trim(),
      classroom: roster ? '' : document.getElementById('room').value.trim(),
    });
    if (!r.ok) {
      btn.disabled = false; btn.textContent = roster ? 'ใช่ ยืนยันว่าเป็นฉัน' : 'ลงทะเบียน';
      return document.getElementById('regErr').textContent = msg(r);
    }
    state.status.registered = true;
    state.status.student = r.student;
    const p = readParams(location.search);
    if (p) return doCheckin(p);
    showHome();
  };
}

function showResult(r) {
  const late = r.status === 'สาย';
  app.className = 'card center ' + (late ? 'late' : 'ok');
  app.innerHTML = `<div class="big">${late ? '⏰' : '✅'}</div>
    <h2>${r.already ? 'เช็คชื่อไว้แล้ว' : (late ? 'เช็คชื่อแล้ว (สาย)' : 'เช็คชื่อสำเร็จ')}</h2>
    <div style="text-align:left;margin-top:14px">
      <div class="row"><span class="muted">ชื่อ</span><b>${esc(r.name)}</b></div>
      ${r.subject ? `<div class="row"><span class="muted">วิชา</span><span>${esc(r.subject)}</span></div>` : ''}
      <div class="row"><span class="muted">สถานะ</span><span>${esc(r.status)}</span></div>
      <div class="row"><span class="muted">เวลา</span><span>${esc(r.time)}</span></div>
    </div>
    <button class="ghost" id="close">ปิด</button>`;
  bind();
}

function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => resolve({ error: e.code === 1 ? 'location_denied' : 'location_timeout' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

function showLocationHelp(code) {
  const ios = liff.getOS() === 'ios';
  const how = ios
    ? 'เปิด <b>การตั้งค่า</b> → <b>LINE</b> → <b>ตำแหน่ง</b> → เลือก <b>ขณะใช้แอป</b> และเปิด <b>ตำแหน่งที่แม่นยำ</b>'
    : 'เปิด <b>การตั้งค่า</b> → <b>แอป</b> → <b>LINE</b> → <b>สิทธิ์</b> → <b>ตำแหน่ง</b> → <b>อนุญาตขณะใช้แอป</b> และเปิด GPS ของเครื่อง';
  app.className = 'card center err';
  app.innerHTML = `<div class="big">📍</div><h2>ต้องใช้ตำแหน่ง</h2><p>${esc(ERR[code])}</p>
    ${code === 'location_denied' ? `<p class="muted" style="text-align:left;margin-top:12px">${how}<br><br>จากนั้นกลับมาสแกน QR ใหม่</p>` : ''}
    <button id="scan">สแกน QR อีกครั้ง</button>
    <button class="ghost" id="close">ปิด</button>`;
  bind();
}

async function doCheckin(p) {
  let loc = null;
  if (state.status.geofence) {
    loading('กำลังตรวจตำแหน่ง...');
    loc = await getLocation();
    if (!loc) return showError(ERR.location_required, true);
    if (loc.error) return showLocationHelp(loc.error);
  }
  loading('กำลังเช็คชื่อ...');
  const r = await api('checkin', { idToken: state.idToken, ...p, ...(loc || {}) });
  if (!r.ok) return showError(msg(r), ['qr_expired', 'qr_invalid', 'too_far', 'network'].includes(r.error));
  showResult(r);
}

async function scan() {
  try {
    const res = await liff.scanCodeV2();
    if (!res || !res.value) return;
    let p = null;
    try { p = readParams(new URL(res.value).search); } catch (e) {}
    if (!p) return showError('QR นี้ไม่ใช่ QR เช็คชื่อ', true);
    doCheckin(p);
  } catch (e) {
    showError('เปิดกล้องสแกนไม่ได้ ลองใช้กล้อง LINE สแกน QR บนจอแทน', false);
  }
}

function bind() {
  const s = document.getElementById('scan'); if (s) s.onclick = scan;
  const c = document.getElementById('close'); if (c) c.onclick = () => liff.closeWindow();
}

async function main() {
  try {
    await liff.init({ liffId: C.LIFF_ID });
  } catch (e) {
    return showError('เปิดระบบไม่สำเร็จ: ' + e.message);
  }
  if (!liff.isInClient()) {
    return showError('กรุณาเปิดหน้านี้ในแอป LINE เท่านั้น (ใช้กล้องมือถือหรือกล้อง LINE สแกน QR)');
  }
  if (!liff.isLoggedIn()) return liff.login();
  state.idToken = liff.getIDToken();
  if (!state.idToken) return showError('ไม่ได้รับ ID token (ตั้งค่า LIFF ต้องเปิด scope openid)');

  const st = await api('status', { idToken: state.idToken });
  if (!st.ok) return showError(msg(st));
  state.status = st;
  if (!st.registered) return showRegister();

  const p = readParams(location.search);
  if (p) return doCheckin(p);
  showHome();
}
main();
</script>
</body>
</html>
